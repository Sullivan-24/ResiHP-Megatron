[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resihp"
version = "0.1.0"
description = "ResiHP: resilient LLM pretraining on Megatron Core with dynamic hybrid parallelism"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ResiHP authors" }]
dependencies = ["torch>=2.10", "numpy"]

[project.optional-dependencies]
etcd = ["etcd3"]
nvml = ["nvidia-ml-py"]
dev = ["pytest>=8"]

[project.scripts]
resihp-run = "resihp.control.launcher:main"
resihp-inject = "resihp.inject.cli:main"
resihp-bench = "resihp.bench.runner:main"

[tool.setuptools.packages.find]
include = ["resihp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPUs and the pinned Megatron-LM checkout",
    "dist: spawns multiple gloo processes on localhost",
    "slow: long-running test",
]
